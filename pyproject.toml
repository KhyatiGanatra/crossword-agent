[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossword-agent"
version = "0.1.0"
description = "A crossword-solving agent built on Token Factory models"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crossword-agent = "crossword_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

